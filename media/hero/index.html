<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1600, height=1200" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=JetBrains+Mono:wght@500&display=block" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --bg: #07060f;
        --line: #262043;
        --text: #ece9f7;
        --muted: #9d97ba;
        --accent: #8f74ff;
        --accent-strong: #6a48f5;
        --soft: #b9a4ff;
        --danger: #ff6b6b;
        --safe: #3ddc84;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1600px; height: 1200px; overflow: hidden; background: var(--bg); }
      #root { position: relative; width: 1600px; height: 1200px; overflow: hidden; background: var(--bg); font-family: Inter, sans-serif; color: var(--text); }
      svg { position: absolute; inset: 0; }
      .tag { font-family: Inter, sans-serif; font-size: 36px; font-weight: 600; fill: var(--text); }
      .sub { font-family: Inter, sans-serif; font-size: 27px; font-weight: 500; fill: var(--muted); }
      .mono { font-family: "JetBrains Mono", monospace; font-size: 16px; fill: var(--muted); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="hero" data-start="0" data-duration="8" data-width="1600" data-height="1200">
      <svg id="art" viewBox="0 0 1600 1200" width="1600" height="1200">
        <defs>
          <radialGradient id="halo" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#6a48f5" stop-opacity="0.55" />
            <stop offset="55%" stop-color="#6a48f5" stop-opacity="0.1" />
            <stop offset="100%" stop-color="#6a48f5" stop-opacity="0" />
          </radialGradient>
          <radialGradient id="core" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="40%" stop-color="#b9a4ff" />
            <stop offset="100%" stop-color="#6a48f5" />
          </radialGradient>
          <radialGradient id="redcore" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ffe2e2" />
            <stop offset="45%" stop-color="#ff6b6b" />
            <stop offset="100%" stop-color="#b3263a" />
          </radialGradient>
          <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
            <feGaussianBlur stdDeviation="7" result="b" />
            <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
          </filter>
          <filter id="softglow" x="-200%" y="-200%" width="500%" height="500%">
            <feGaussianBlur stdDeviation="4" result="b" />
            <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
          </filter>
        </defs>
        <g id="world">
          <circle cx="800" cy="600" r="560" fill="url(#halo)" />
          <g id="sphere"></g>
          <g id="links"></g>
          <g id="particles"></g>
          <g id="nodes"></g>
          <g id="cards"></g>
        </g>
      </svg>
    </div>

    <script>
      const LOOP = 8;
      const TAU = Math.PI * 2;
      const NS = "http://www.w3.org/2000/svg";
      const el = (tag, attrs, parent) => {
        const n = document.createElementNS(NS, tag);
        for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
        parent?.appendChild(n);
        return n;
      };
      const frac = (x) => x - Math.floor(x);

      // ---- Background globe: points on a sphere that sway (periodic, so the loop is seamless) ----
      const sphere = document.getElementById("sphere");
      const SP = [];
      const COUNT = 90;
      for (let i = 0; i < COUNT; i++) {
        const y = 1 - (i / (COUNT - 1)) * 2;
        const r = Math.sqrt(1 - y * y);
        const th = i * Math.PI * (3 - Math.sqrt(5));
        SP.push({ x: Math.cos(th) * r, y, z: Math.sin(th) * r });
      }
      const spLinks = [];
      SP.forEach((a, i) => SP.forEach((b, j) => { if (j > i && Math.hypot(a.x - b.x, a.y - b.y, a.z - b.z) < 0.36) spLinks.push([i, j]); }));
      const spLineEls = spLinks.map(() => el("line", { stroke: "#8f74ff", "stroke-width": 1 }, sphere));
      const spDotEls = SP.map(() => el("circle", { fill: "#cfc6ff" }, sphere));
      function drawSphere(t) {
        const yaw = 0.35 * Math.sin(TAU * t);
        const pitch = 0.45 + 0.08 * Math.sin(TAU * t + 1);
        const R = 520;
        const proj = SP.map((p) => {
          const x1 = p.x * Math.cos(yaw) + p.z * Math.sin(yaw);
          const z1 = -p.x * Math.sin(yaw) + p.z * Math.cos(yaw);
          const y2 = p.y * Math.cos(pitch) - z1 * Math.sin(pitch);
          const z2 = p.y * Math.sin(pitch) + z1 * Math.cos(pitch);
          return { x: 800 + x1 * R, y: 600 + y2 * R, d: (z2 + 1) / 2 };
        });
        spLinks.forEach(([a, b], k) => {
          const p = proj[a], q = proj[b];
          const s = spLineEls[k];
          s.setAttribute("x1", p.x); s.setAttribute("y1", p.y); s.setAttribute("x2", q.x); s.setAttribute("y2", q.y);
          s.setAttribute("stroke-opacity", (0.03 + 0.12 * Math.min(p.d, q.d)).toFixed(3));
        });
        proj.forEach((p, k) => {
          const c = spDotEls[k];
          c.setAttribute("cx", p.x); c.setAttribute("cy", p.y);
          c.setAttribute("r", (1 + p.d * 2).toFixed(2));
          c.setAttribute("fill-opacity", (0.08 + p.d * 0.35).toFixed(3));
        });
      }

      // ---- The wallet graph ----
      const N = {
        f3: { x: 150, y: 790, kind: "funder", r: 16 },
        f2: { x: 300, y: 600, kind: "funder", r: 18 },
        f1: { x: 500, y: 470, kind: "funder", r: 20 },
        bad: { x: 380, y: 950, kind: "danger", r: 20 },
        dev: { x: 800, y: 600, kind: "dev", r: 46 },
        l1: { x: 760, y: 300, kind: "linked", r: 15 },
        l2: { x: 1010, y: 360, kind: "linked", r: 15 },
        l3: { x: 1000, y: 860, kind: "linked", r: 15 },
        l4: { x: 690, y: 920, kind: "linked", r: 15 },
        t1: { x: 1300, y: 300, kind: "dead", r: 22 },
        t2: { x: 1440, y: 520, kind: "dead", r: 22 },
        t3: { x: 1430, y: 730, kind: "safe", r: 22 },
        t4: { x: 1170, y: 1020, kind: "dead", r: 22 },
      };
      const EDGES = [
        // funding chain, money flows toward the dev
        { a: "f3", b: "f2", kind: "fund", bend: -40, n: 1, off: 0.0 },
        { a: "f2", b: "f1", kind: "fund", bend: -40, n: 1, off: 0.25 },
        { a: "f1", b: "dev", kind: "fund", bend: -50, n: 2, off: 0.5 },
        { a: "bad", b: "dev", kind: "taint", bend: 60, n: 1, off: 0.1 },
        { a: "bad", b: "l4", kind: "taint", bend: 30, n: 1, off: 0.6 },
        // linked wallets
        { a: "dev", b: "l1", kind: "link", bend: 30, n: 1, off: 0.3 },
        { a: "dev", b: "l2", kind: "link", bend: -30, n: 1, off: 0.7 },
        { a: "dev", b: "l3", kind: "link", bend: 30, n: 1, off: 0.15 },
        { a: "dev", b: "l4", kind: "link", bend: -30, n: 1, off: 0.85 },
        // launches, sell-offs flow out to dead tokens
        { a: "dev", b: "t1", kind: "exit", bend: -60, n: 2, off: 0.0 },
        { a: "dev", b: "t2", kind: "exit", bend: -30, n: 2, off: 0.33 },
        { a: "dev", b: "t3", kind: "launch", bend: 20, n: 1, off: 0.5 },
        { a: "dev", b: "t4", kind: "exit", bend: 50, n: 2, off: 0.66 },
        { a: "l2", b: "t1", kind: "insider", bend: -20, n: 1, off: 0.4 },
        { a: "l3", b: "t4", kind: "insider", bend: 20, n: 1, off: 0.9 },
      ];
      const EDGE_STYLE = {
        fund: { stroke: "#8f74ff", w: 2.4, op: 0.75, dot: "#e6e0ff" },
        taint: { stroke: "#ff6b6b", w: 2, op: 0.55, dot: "#ffd0d0", dash: "6 8" },
        link: { stroke: "#8f74ff", w: 1.4, op: 0.35, dot: "#b9a4ff" },
        exit: { stroke: "#ff6b6b", w: 2.2, op: 0.6, dot: "#ffe2e2" },
        launch: { stroke: "#3ddc84", w: 2, op: 0.5, dot: "#d6ffe8" },
        insider: { stroke: "#ff9b6b", w: 1.4, op: 0.4, dot: "#ffd9c4", dash: "4 7" },
      };
      const linksG = document.getElementById("links");
      const partG = document.getElementById("particles");
      const edges = EDGES.map((e) => {
        const A = N[e.a], B = N[e.b];
        const mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2;
        const dx = B.x - A.x, dy = B.y - A.y, len = Math.hypot(dx, dy);
        const cx = mx - (dy / len) * e.bend, cy = my + (dx / len) * e.bend;
        const st = EDGE_STYLE[e.kind];
        const path = el("path", { d: `M${A.x},${A.y} Q${cx},${cy} ${B.x},${B.y}`, fill: "none", stroke: st.stroke, "stroke-width": st.w, "stroke-opacity": st.op, "stroke-linecap": "round" }, linksG);
        if (st.dash) path.setAttribute("stroke-dasharray", st.dash);
        const total = path.getTotalLength();
        const dots = Array.from({ length: e.n * 2 }, (_, i) => ({
          head: el("circle", { r: i % 2 ? 3 : 5, fill: st.dot, filter: "url(#softglow)" }, partG),
          phase: i / (e.n * 2),
        }));
        return { ...e, path, total, dots, st };
      });

      const nodesG = document.getElementById("nodes");
      const nodeEls = {};
      for (const [id, n] of Object.entries(N)) {
        const g = el("g", {}, nodesG);
        const ring = el("circle", { cx: n.x, cy: n.y, r: n.r + 10, fill: "none", "stroke-width": 2 }, g);
        let fill = "#16132a", stroke = "#8f74ff";
        if (n.kind === "dev") { fill = "url(#core)"; stroke = "#b9a4ff"; }
        if (n.kind === "danger" || n.kind === "dead") { fill = n.kind === "dead" ? "url(#redcore)" : "#2a1020"; stroke = "#ff6b6b"; }
        if (n.kind === "safe") { fill = "#0f2a1c"; stroke = "#3ddc84"; }
        if (n.kind === "linked") { fill = "#1b1733"; stroke = "#6f63a8"; }
        ring.setAttribute("stroke", stroke);
        const body = el("circle", { cx: n.x, cy: n.y, r: n.r, fill, stroke, "stroke-width": 2.5, filter: n.kind === "dev" || n.kind === "dead" ? "url(#glow)" : "" }, g);
        nodeEls[id] = { ring, body, n };
      }

      // ---- Cards (role labels only; no made-up addresses) ----
      const cardsG = document.getElementById("cards");
      function card(x, y, w, title, sub, tone) {
        const g = el("g", {}, cardsG);
        const border = tone === "danger" ? "#ff6b6b" : tone === "safe" ? "#3ddc84" : "#3a3166";
        el("rect", { x, y, width: w, height: sub ? 98 : 60, rx: 18, fill: "#0e0c1a", "fill-opacity": 0.92, stroke: border, "stroke-opacity": 0.8 }, g);
        el("circle", { cx: x + 26, cy: y + 32, r: 8, fill: tone === "danger" ? "#ff6b6b" : tone === "safe" ? "#3ddc84" : "#8f74ff" }, g);
        const t = el("text", { x: x + 46, y: y + 44, class: "tag" }, g); t.textContent = title;
        if (sub) { const s = el("text", { x: x + 24, y: y + 80, class: "sub" }, g); s.textContent = sub; }
        return g;
      }
      const cards = [
        card(250, 300, 330, "Funder · hop 1", "paid the dev", "accent"),
        card(160, 1050, 400, "Shared funder", "backed 7 dead launches", "danger"),
        card(610, 400, 380, "Dev wallet", "deployed 4 tokens", "accent"),
        card(1010, 130, 360, "Launch 1", "dead · dev exited", "danger"),
        card(1200, 790, 360, "Launch 3", "migrated", "safe"),
      ];

      // Risk badge
      const badge = el("g", {}, cardsG);
      el("rect", { x: 940, y: 500, width: 290, height: 150, rx: 20, fill: "#0e0c1a", "fill-opacity": 0.94, stroke: "#ff6b6b", "stroke-opacity": 0.9 }, badge);
      const bl = el("text", { x: 966, y: 546, class: "sub" }, badge); bl.textContent = "Risk score";
      const bn = el("text", { x: 964, y: 624, "font-family": "Inter", "font-size": 78, "font-weight": 700, fill: "#ff6b6b" }, badge); bn.textContent = "78";
      const bs = el("text", { x: 1070, y: 620, class: "sub" }, badge); bs.textContent = "/ 100 high";

      function draw(t) {
        drawSphere(t);
        for (const e of edges) {
          for (const d of e.dots) {
            const p = frac(t * e.n + e.off + d.phase);
            const pt = e.path.getPointAtLength(p * e.total);
            d.head.setAttribute("cx", pt.x.toFixed(1));
            d.head.setAttribute("cy", pt.y.toFixed(1));
            // fade in and out at the ends so dots never pop
            const edgeFade = Math.min(1, p * 6, (1 - p) * 6);
            d.head.setAttribute("opacity", edgeFade.toFixed(3));
          }
        }
        for (const [id, { ring, n }] of Object.entries(nodeEls)) {
          const speed = n.kind === "dev" ? 2 : 1;
          const ph = frac(t * speed + (n.x + n.y) / 997);
          ring.setAttribute("r", (n.r + 6 + ph * (n.kind === "dev" ? 46 : 18)).toFixed(1));
          ring.setAttribute("stroke-opacity", ((1 - ph) * (n.kind === "dev" ? 0.7 : 0.45)).toFixed(3));
        }
        cards.forEach((g, i) => g.setAttribute("transform", `translate(0 ${(4 * Math.sin(TAU * t + i)).toFixed(2)})`));
        const beat = 1 + 0.04 * Math.max(0, Math.sin(TAU * t * 2));
        badge.setAttribute("transform", `translate(1085 575) scale(${beat.toFixed(4)}) translate(-1085 -575)`);
        const w = 1 + 0.015 * Math.sin(TAU * t);
        document.getElementById("world").setAttribute("transform", `translate(800 600) scale(${w.toFixed(4)}) translate(-800 -600)`);
      }

      const state = { t: 0 };
      draw(0);
      const tl = gsap.timeline({ paused: true });
      tl.to(state, { t: 1, duration: LOOP, ease: "none", onUpdate: () => draw(state.t) }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines["hero"] = tl;
    </script>
  </body>
</html>
